[package]
name = "uclan_timetable"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.3"
ordered-float = "5.1.0"
reqwest = { version = "0.12.24", features = ["blocking"] }
scraper = "0.24.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
