<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      type="text/javascript"
      src="https://api.mazemap.com/js/v3.0.9/mazemap.min.js"
    ></script>
    <script>
      window.addEventListener("load", () => {
        document.getElementById("run").addEventListener("click", async () => {
          const buildings = await Mazemap.Data.getBuildingsByCampusId(368);

          console.log(buildings);

          document.getElementById("buildings").innerHTML = "";

          const ul = document.createElement("ul");

          for (const building of buildings) {
            const li = document.createElement("li");
            li.innerHTML = building.properties.name;

            console.log(building);

            const pois = await Mazemap.Data.getPois({
              campusid: 368,
              buildingid: building.properties.id,
            });

            console.log(pois);

            const innerUl = document.createElement("ul");

            for (const poi of pois) {
              if (!poi.properties.title) continue;
              const li = document.createElement("li");
              li.innerHTML = poi.properties.title;
              // poi.properties.title + " of " + poi.properties.identifier;
              innerUl.appendChild(li);
            }

            li.appendChild(innerUl);

            ul.appendChild(li);
            document.getElementById("buildings").appendChild(ul);
          }
        });
      });
    </script>
    <title>Test</title>
  </head>
  <body>
    <button id="run">Run</button>
    <h1>Buildings and Rooms</h1>
    <div id="buildings"></div>
  </body>
</html>
